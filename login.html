<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Yuri Brandão</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data-mock.js"></script>
<link rel="stylesheet" href="css/member.css">
</head>
<body>
<div class="login-wrap"><div class="login-card">
<a href="index.html" style="text-decoration:none;font-size:1.5rem">←</a>
<h1>ÁREA DO <span>ALUNO</span></h1>
<p>Pagou o Yuri no pessoal? Entra com o login que ele te passou.</p>
<div class="err" id="err"></div>
<label>Email</label><input id="email" type="email" placeholder="voce@email.com" autocomplete="email">
<label>Senha</label><input id="senha" type="password" placeholder="••••••••" autocomplete="current-password">
<button class="btn-primary" id="btnEntrar" onclick="entrar()">Entrar →</button>
<p style="text-align:center;margin:.9rem 0 0"><a href="#" id="forgot" onclick="esqueci(event)" style="color:var(--p);font-size:.85rem;font-weight:700">Esqueci a senha</a></p>
<div class="ok" id="ok"></div>
<div class="demo" id="demoHint">Modo demo: use <b>demo@yuri.com / 123456</b> (aluno) ou <b>admin@yuri.com / admin</b> (Yuri)</div>
<a class="back" href="https://wa.me/5527999585475?text=Quero+acesso+aos+treinos!" target="_blank">Ainda não tem acesso? Chama no WhatsApp</a>
</div></div>
<script>
if (!DEMO_MODE) document.getElementById('demoHint').style.display='none';
function ptErro(m){
  if(/invalid login credentials/i.test(m))return 'Email ou senha errados. Confere e tenta de novo.';
  if(/email not confirmed/i.test(m))return 'Confirma teu email antes (olha a caixa de entrada) ou chama o Yuri.';
  if(/already registered|already exists/i.test(m))return 'Esse email já tem cadastro. Tenta entrar.';
  if(/password/i.test(m))return 'Senha inválida.';
  if(/network|fetch|failed/i.test(m))return 'Sem conexão. Checa a internet e tenta de novo.';
  return m;
}
async function entrar(){
  const email=document.getElementById('email').value.trim(), senha=document.getElementById('senha').value;
  const err=document.getElementById('err'), ok=document.getElementById('ok'), btn=document.getElementById('btnEntrar');
  err.style.display='none';ok.style.display='none';
  if(!email||!senha){err.textContent='Preencha email e senha.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Entrando...';
  try{
    if(!DEMO_MODE){
      const {data,error}=await supa.auth.signInWithPassword({email,password:senha});
      if(error)throw error;
      const {data:prof}=await supa.from('profiles').select('*').eq('id',data.user.id).single();
      if(prof && prof.ativo===false){await supa.auth.signOut();throw new Error('blocked');}
      localStorage.setItem('yuri_user',JSON.stringify({email, role:prof?.role||'aluno', nome:prof?.nome||email}));
      location.href=(prof?.role==='admin')?'admin.html':'app.html';
      return;
    }
    const u=MOCK_USERS.find(x=>x.email===email&&x.senha===senha);
    if(!u){err.textContent='Demo: use demo@yuri.com / 123456';err.style.display='block';return;}
    localStorage.setItem('yuri_user',JSON.stringify(u));
    location.href=(u.role==='admin')?'admin.html':'app.html';
  }catch(e){
    err.textContent=(e.message==='blocked')?'Acesso desativado. Fala com o Yuri no WhatsApp.':'Login inválido: '+ptErro(e.message);
    err.style.display='block';
  }
  btn.disabled=false;btn.textContent='Entrar →';
}
async function esqueci(ev){
  ev.preventDefault();
  const email=document.getElementById('email').value.trim();
  const err=document.getElementById('err'), ok=document.getElementById('ok');
  err.style.display='none';ok.style.display='none';
  if(!email){err.textContent='Digita teu email ali em cima primeiro.';err.style.display='block';return;}
  if(DEMO_MODE){err.textContent='Demo: sem envio de email.';err.style.display='block';return;}
  const {error}=await supa.auth.resetPasswordForEmail(email);
  if(error){err.textContent=ptErro(error.message);err.style.display='block';}
  else{ok.textContent='Te mandei um link de nova senha no email. Olha a caixa de entrada.';ok.style.display='block';}
}
document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
</script>
</body>
</html>
